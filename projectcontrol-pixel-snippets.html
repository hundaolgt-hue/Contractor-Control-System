  Rapha ProjectControl — Meta Pixel "Contractor Control" (2557153074710042)
  Landing page: rapha-projectcontrol.vercel.app

  1) Paste BLOCK A inside <head> on EVERY page (index and the /go page).
  2) Paste BLOCK B just before </body> on the index page.
  3) Paste BLOCK C just before </body> on the /go page
     (and remove or lengthen any existing instant redirect there — see note in C).
  Do NOT add the SiteCalc pixel (1089421114009929) to this site.
-->

<!-- ===== BLOCK A: Meta Pixel base code (every page, inside <head>) ===== -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '2557153074710042');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=2557153074710042&ev=PageView&noscript=1"/></noscript>
<!-- ===== end BLOCK A ===== -->


<!-- ===== BLOCK B: index page (before </body>) ===== -->
<script>
  // Product view on load
  fbq('track', 'ViewContent', {
    content_name: 'Rapha ProjectControl',
    content_ids: ['rapha-projectcontrol'],
    content_type: 'product',
    value: 2999,
    currency: 'ETB'
  });
  // All buy buttons go to /go, and InitiateCheckout fires there (BLOCK C),
  // so nothing else is needed on this page.
</script>
<!-- ===== end BLOCK B ===== -->


<!-- ===== BLOCK C: /go page (before </body>) =====
  The /go page currently forwards to:
  https://ye-buna.com/hundaolgirma?ref=product_detail&product=6abe27740bdd7_hundaolgirma
  If it redirects instantly (meta refresh 0 / location.replace on load), the pixel
  may not have time to send. Replace that redirect with this one, which waits up to ~0.8 s.
-->
<script>
  (function () {
    var DEST = 'https://ye-buna.com/hundaolgirma?ref=product_detail&product=6abe27740bdd7_hundaolgirma';
    // Every buy button on the landing page leads here, so this is the checkout-start signal
    fbq('track', 'InitiateCheckout', {
      content_name: 'Rapha ProjectControl',
      content_ids: ['rapha-projectcontrol'],
      content_type: 'product',
      value: 2999,
      currency: 'ETB'
    });
    var done = false;
    function go() { if (!done) { done = true; window.location.replace(DEST); } }
    setTimeout(go, 800);
  })();
</script>
<!-- ===== end BLOCK C ===== -->
